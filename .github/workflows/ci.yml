name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: |
          cargo test --all-features --lib --bins
          cargo test --all-features --test version_test --test aws_key_validation_test --test aws_pattern_fix_test --test entropy_test --test integration --test output_edge_cases_test_fixed --test output_test --test pattern_consistency_test --test pattern_test --test scanner_test --test sota_features_test --test rule_table_test --test prefilter_test --test uuid_rules_test --test private_key_dedupe_test --test scan_path_test --test severity_test --test baseline_test --test config_test --test placeholder_test --test exit_code_test --test git_history_test --test staged_test --test stdin_test --test provider_rules_test --test jwt_validation_test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-features --all-targets

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check at the declared MSRV (lib and bins, the install surface)
        run: cargo check --locked --all-features

  # The staged/hook tests once failed on a bare validation box (findings
  # 2026-11-16: the guarded commit was not rejected). The tests carry their
  # own git identity per invocation (`-c user.name`/`-c user.email` in the
  # git() helper, tests/staged_test.rs) and pin hook resolution to the temp
  # repo's own hooks dir, because the demonstrated ambient dependency is a
  # global `core.hooksPath` (reproduced locally; see PR #13). This leg makes
  # the container hostile the same way — a bogus global core.hooksPath plus a
  # group-writable umask — so if the pin is ever removed the leg goes red,
  # and it blocks the merge when that regression lands.
  bare-env:
    name: Bare container (rust:1)
    runs-on: ubuntu-latest
    container: rust:1
    timeout-minutes: 15
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Make the container hostile (ambient global core.hooksPath)
        run: git config --global core.hooksPath /nonexistent-hooks
      - name: Hook/staging tests under the hostile global config
        run: bash -c 'umask 0002; cargo test --locked --test staged_test'
