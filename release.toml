# Configuration for cargo-release

# Sign commits and tags
sign-commit = true
sign-tag = true

# Run these commands before release
pre-release-hook = ["cargo test", "cargo clippy -- -D warnings", "cargo fmt -- --check"]

# Commit message for version bump
pre-release-commit-message = "chore: release version {{version}}"

# Don't push to remote automatically
push = false

# Don't publish to crates.io automatically  
publish = false

# Tag format
tag-prefix = "v"
tag-message = "Release version {{version}}"

# Update these files with version
pre-release-replacements = [
  # Update version in title
  {file="README.md", search="# secretscan 🔍 v[0-9.]+", replace="# secretscan 🔍 v{{version}}"},
  # (Pruned: the download-link and bare-version patterns no longer match any
  # README text and would fail the release with min=1. Only patterns that
  # match today are kept: the version header below and CITATION.cff.)
  # CITATION.cff version (src/main.rs now reads env!("CARGO_PKG_VERSION"), no longer needs a rewrite)
  {file="CITATION.cff", search="version: \"[0-9.]+\"", replace="version: \"{{version}}\""},
  # CHANGELOG release sections are maintained manually at release-prep time
]

# Changelog generation would require git-cliff
# [[pre-release-hook]]
# command = "git"
# args = ["cliff", "-o", "CHANGELOG.md", "--tag", "v{{version}}"]