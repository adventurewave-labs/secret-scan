[package]
name = "secretscan"
version = "0.2.3"
edition = "2021"
description = "A blazing-fast secret scanner for your codebase"
authors = ["Secretscan Team <support@secretscan.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/adventurewave-labs/secret-scan"
repository = "https://github.com/adventurewave-labs/secret-scan"
documentation = "https://github.com/adventurewave-labs/secret-scan#readme"
keywords = ["security", "secrets", "scanner", "credentials", "detection"]
categories = ["command-line-utilities", "development-tools", "security"]
exclude = [
    ".github/*",
    "docs/demo.gif",
    "benches/large_test_data/*",
    "coverage/*",
    "reports/*"
]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[[bin]]
name = "secretscan"
path = "src/main.rs"


[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"
ignore = "0.4"
rayon = "1"
lazy_static = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
url = "2"
colored = "2"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "scanning"
harness = false
